# Production Reliability workstream. Started via the `monitoring`
# docker-compose profile (`docker compose --profile monitoring up`),
# NOT part of the default `docker compose up` -- the base 4-service
# stack (postgres/redis/python-api/node-api) is unchanged. See
# docs/RELIABILITY.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-api
    metrics_path: /metrics
    static_configs:
      - targets: ["node-api:4000"]

  - job_name: python-api
    metrics_path: /metrics
    static_configs:
      - targets: ["python-api:8000"]

  # Host-level CPU/RAM/disk (capacity monitoring item 1). Textfile
  # collector also surfaces the pg_backup_* success/timestamp metrics
  # written by ops/backup/*.sh -- see the shared metrics_textfile volume.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container CPU/RAM (capacity monitoring item 1, "container health").
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Connection usage, locks/waits, replication lag if any (capacity
  # monitoring item 3, "database monitoring").
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
